<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Village stroll icon">
  <defs>
    <style>
      .stroke { fill:none; stroke:#2B8A2B; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .dot-1 { fill:#2B8A2B; }
      .dot-2 { fill:#95D6A9; }
      .bg { fill:#F6F9F2; }
    </style>
  </defs>

  <!-- circular background (optional) -->
  <rect width="64" height="64" rx="10" ry="10" class="bg"/>

  <!-- eye outline -->
  <path class="stroke" d="M6 32 C14 14, 50 14, 58 32 C50 50, 14 50, 6 32 Z"/>

  <!-- iris (solid circle) -->
  <circle cx="32" cy="32" r="8" class="stroke" />

  <!-- stylized 'people' dots forming a small cluster in the iris -->
  <!-- green dots -->
  <circle cx="32" cy="28" r="1.8" class="dot-1"/>
  <circle cx="30.5" cy="31" r="1.5" class="dot-1"/>
  <circle cx="33.5" cy="31.4" r="1.4" class="dot-1"/>
  <circle cx="31.2" cy="34" r="1.2" class="dot-1"/>

  <!-- mint dots -->
  <circle cx="34.8" cy="29.8" r="1.5" class="dot-2"/>
  <circle cx="29" cy="29" r="1.2" class="dot-2"/>
  <circle cx="33" cy="27" r="1.1" class="dot-2"/>

  <!-- subtle group of dots along the upper lash to hint 'crowd' -->
  <circle cx="20" cy="22" r="0.9" class="dot-2"/>
  <circle cx="24" cy="20.6" r="0.9" class="dot-2"/>
  <circle cx="40" cy="20.8" r="0.9" class="dot-2"/>
  <circle cx="44" cy="22.6" r="0.9" class="dot-2"/>

</svg>